name: Fetch car photos

# Downloads the car photos listed in images/cars/photos.txt from Wikimedia Commons
# (free-licence images) and stores copies in images/cars/ so the site serves them itself.
on:
  push:
    branches: [main]
    paths: ["images/cars/photos.txt", ".github/workflows/fetch-photos.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-photos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download missing photos
        run: |
          python3 - <<'PY'
          import os, time, urllib.parse, urllib.request
          UA = "MayoCarsPhotoFetcher/1.0 (https://mayocars.com; wakeelmayo@gmail.com)"
          ok = skipped = failed = 0
          failures = []
          for line in open("images/cars/photos.txt", encoding="utf-8"):
              line = line.strip()
              if not line or "|" not in line:
                  continue
              local, name = line.split("|", 1)
              path = os.path.join("images/cars", local)
              if os.path.exists(path) and os.path.getsize(path) > 5000:
                  skipped += 1
                  continue
              url = "https://commons.wikimedia.org/wiki/Special:FilePath/" + urllib.parse.quote(name, safe="") + "?width=1280"
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          data = r.read()
                      if len(data) < 5000:
                          raise ValueError("file too small")
                      open(path, "wb").write(data)
                      ok += 1
                      print("OK  ", local, len(data))
                      break
                  except Exception as e:
                      print("RETRY", local, e)
                      time.sleep(5 * (attempt + 1))
              else:
                  failed += 1
                  failures.append(name)
              time.sleep(1.5)
          open("images/cars/failed.txt", "w").write("\n".join(failures) + ("\n" if failures else ""))
          print(f"downloaded={ok} skipped={skipped} failed={failed}")
          PY

      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/cars
          if git diff --cached --quiet; then
            echo "No new photos"
          else
            git commit -m "Add car photos (downloaded from Wikimedia Commons)"
            git push
          fi
